pluginManagement {
  // React Native from-source (hermes-engine) requires ANDROID_HOME even when
  // android/local.properties has sdk.dir — Android Studio often has neither env var.
  def _lp = new File(settingsDir, "local.properties")
  def _sdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
  if ((_sdk == null || _sdk.trim().isEmpty()) && _lp.exists()) {
    def _props = new Properties()
    _lp.withInputStream { _props.load(it) }
    _sdk = _props.getProperty("sdk.dir")?.replace("\\:", ":")
  }
  if (_sdk == null || _sdk.trim().isEmpty()) {
    def _mac = new File(System.getProperty("user.home"), "Library/Android/sdk")
    if (_mac.isDirectory()) _sdk = _mac.absolutePath
  }
  if (_sdk != null && !_sdk.trim().isEmpty()) {
    def _rnLocal = new File(settingsDir, "../node_modules/react-native/local.properties")
    try {
      _rnLocal.parentFile?.mkdirs()
      _rnLocal.text = "sdk.dir=${_sdk}\n"
    } catch (Throwable ignored) {
      /* best-effort for Studio builds */
    }
  }

  def envNode = System.getenv("NODE_BINARY")
  def nodeExecutable = "node"
  if (envNode != null && !envNode.trim().isEmpty() && new File(envNode.trim()).exists()) {
    nodeExecutable = envNode.trim()
  } else {
    def localPropsFile = new File(settingsDir, "local.properties")
    if (localPropsFile.exists()) {
      def props = new Properties()
      localPropsFile.withInputStream { props.load(it) }
      def nodeBinary = props.getProperty("node.binary")
      if (nodeBinary != null && !nodeBinary.trim().isEmpty() && new File(nodeBinary.trim()).exists()) {
        nodeExecutable = nodeBinary.trim()
      }
    }
    if (nodeExecutable == "node") {
      def gradlePropsFile = new File(settingsDir, "gradle.properties")
      if (gradlePropsFile.exists()) {
        def props = new Properties()
        gradlePropsFile.withInputStream { props.load(it) }
        def nodeBinary = props.getProperty("NODE_BINARY")
        if (nodeBinary != null && !nodeBinary.trim().isEmpty() && new File(nodeBinary.trim()).exists()) {
          nodeExecutable = nodeBinary.trim()
        }
      }
    }
    if (nodeExecutable == "node") {
      ["/usr/local/bin/node", "/opt/homebrew/bin/node"].each { candidate ->
        if (nodeExecutable == "node" && new File(candidate).exists()) {
          nodeExecutable = candidate
        }
      }
    }
  }

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExecutable, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExecutable, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Word Wheel Quest'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)

// Build React Native from source so patches/react-native+*.patch (Fabric
// SurfaceMountingManager soft-fail) are compiled into the app. Prebuilt
// react-android AARs ignore Java edits under node_modules.
includeBuild(expoAutolinking.reactNative) {
  dependencySubstitution {
    substitute(module("com.facebook.react:react-android")).using(project(":packages:react-native:ReactAndroid"))
    substitute(module("com.facebook.react:react-native")).using(project(":packages:react-native:ReactAndroid"))
    substitute(module("com.facebook.react:hermes-android")).using(project(":packages:react-native:ReactAndroid:hermes-engine"))
    substitute(module("com.facebook.react:hermes-engine")).using(project(":packages:react-native:ReactAndroid:hermes-engine"))
  }
}
